<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Hear a letter and tap its match in this simple alphabet game for toddlers.">
<meta name="theme-color" content="#fff6e9">
<title>Find the Letter | AbideCrest Media</title>
<style>
* { box-sizing:border-box }
:root { color-scheme:light; --ink:#262958; --paper:#fff6e9; --plum:#4938a1 }
body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.45 system-ui,sans-serif }
main { width:min(100% - 32px, 62rem); margin:auto; padding:18px 0 28px }
.game-stage { display:grid; grid-template-columns:minmax(0,2.65fr) minmax(0,1fr); gap:clamp(12px,2vw,24px); align-items:center }
.shell-presenter { margin:0; text-align:center; font-weight:750 }
.shell-standing { position:relative; width:100%; aspect-ratio:384/340; overflow:hidden; transform:scaleX(-1) }
.shell-standing img { position:absolute; top:-22.4%; left:0; width:166.667%; height:auto; max-width:none; clip-path:polygon(15.3% 12.0%, 21.4% 11.3%, 30.3% 12.2%, 55.8% 12.2%, 60.2% 13.7%, 60.3% 16.2%, 56.9% 18.4%, 48.4% 19.5%, 34.1% 19.4%, 32.3% 23.9%, 31.3% 26.3%, 28.3% 27.9%, 29.1% 29.4%, 33.0% 27.8%, 37.8% 28.2%, 38.9% 29.8%, 37.8% 31.7%, 35.8% 34.8%, 35.8% 38.2%, 33.8% 40.4%, 31.7% 41.7%, 28.6% 43.0%, 27.5% 47.9%, 25.6% 51.5%, 28.6% 53.7%, 28.9% 57.4%, 26.7% 58.4%, 15.6% 59.0%, 10.2% 60.2%, 5.8% 59.6%, 3.4% 58.4%, 3.4% 55.4%, 5.9% 53.7%, 7.5% 51.0%, 7.5% 45.8%, 6.1% 45.7%, 3.0% 43.3%, 1.9% 39.2%, 1.7% 33.3%, 3.0% 29.2%, 7.3% 24.2%, 14.2% 21.1%, 15.2% 17.9%) }
@media(max-width:720px) {
  main { max-width:44rem }
  .game-stage { grid-template-columns:minmax(0,1fr) }
  .shell-presenter { width:min(47%,10rem); margin-inline:auto }
}
a { color:#443c88; font-weight:700; display:inline-flex; align-items:center; min-height:44px }
h1 { font-size:clamp(2.45rem,8.5vw,4.6rem); line-height:1.02; letter-spacing:-.05em; margin:.2em 0 .25em }
.intro { font-size:clamp(1rem,3vw,1.25rem); margin:0 0 16px }
.game { border-radius:24px; padding:clamp(14px,4vw,28px); background:#fffdfa; border:1px solid #e6dccf }
.controls { display:flex; gap:8px; flex-wrap:wrap; align-items:center }
.difficulty { display:flex; align-items:center; gap:8px; margin:0 0 12px; font-weight:700 }
.difficulty select { min-height:44px; padding:6px 10px; border:1px solid #8d82b6; border-radius:10px; font:inherit; color:inherit; background:white }
.stats { margin:14px 0 0; border:1px solid #e6dccf; border-radius:18px; background:#fffdfa; padding:14px 18px }
.stats h2 { font-size:1rem; margin:0 0 8px }
.stats dl { display:flex; flex-wrap:wrap; gap:8px 24px; margin:0 }
.stats dd { margin:2px 0 0; font-weight:760; font-variant-numeric:tabular-nums }
.stats p { margin:8px 0 0; font-size:.9rem }
button { min-height:46px; border-radius:13px; border:2px solid transparent; cursor:pointer; font:inherit; font-weight:760; color:inherit; touch-action:manipulation }
#hear, #next { padding:9px 16px; background:var(--plum); color:white }
#hear { min-height:54px; font-size:1.15rem }
#show { padding:8px 12px; background:transparent; color:#443c88; text-decoration:underline }
button:focus-visible, select:focus-visible, a:focus-visible { outline:3px solid #294cbb; outline-offset:3px }
[hidden] { display:none!important }
#prompt { display:flex; align-items:center; gap:12px; margin:12px 0 0; padding:8px 12px; background:#f6efff; border-radius:14px; font-size:clamp(1.08rem,4vw,1.35rem); font-weight:750 }
#prompt-picture { flex:0 0 auto; font-size:clamp(2.3rem,10vw,3.5rem); line-height:1.15 }
.tiles { display:grid; grid-template-columns:1fr 1fr; gap:clamp(8px,3vw,18px); margin:16px 0 0 }
.letter { border-radius:20px; background:#dcecff; border-color:#709bca; min-height:clamp(98px,23vw,178px); font:800 clamp(3.75rem,19vw,7rem)/1 Arial,sans-serif }
.tiles[data-count="3"] { grid-template-columns:repeat(3,minmax(0,1fr)) }
.tiles[data-count="3"] .letter { font-size:clamp(2.6rem,14vw,5.8rem); padding-inline:0 }
.tiles[data-count="4"] .letter { min-height:clamp(86px,18vw,132px); font-size:clamp(2.8rem,14vw,5.6rem) }
.letter:nth-child(2) { background:#ffe7a6; border-color:#b48a30 }
.letter:nth-child(3) { background:#f0e6ff; border-color:#9172b8 }
.letter:nth-child(4) { background:#ffe3ec; border-color:#be7290 }
.letter.correct { background:#c7f3cc; border-color:#26824b }
.letter:disabled { opacity:1; cursor:default }
.result { min-height:53px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px; margin-top:12px }
#status { margin:0; font-size:1.05rem; font-weight:700 }

.character-friends { margin:14px 0 0; padding:14px 18px; background:#fffdfa; border:1px solid #e6dccf; border-radius:18px }
.character-friends h2 { margin:0 0 10px; font-size:1rem }
.character-list { display:flex; flex-wrap:wrap; gap:12px 18px }
.character-list figure { margin:0; text-align:center; font-weight:750 }
.character-portrait { position:relative; overflow:hidden; width:clamp(68px,17vw,94px); aspect-ratio:1; border-radius:50%; border:2px solid #d9c6b4; background:#f9edda }
.character-portrait img { position:absolute; width:var(--sheet-width); height:auto; max-width:none; top:var(--crop-top); left:var(--crop-left) }
.character-barnaby { --sheet-width:338%; --crop-top:0%; --crop-left:-33% }
.character-rascal { --sheet-width:327%; --crop-top:-64%; --crop-left:-180% }
.character-list figcaption { margin-top:4px }

.character-list button{display:flex;flex-direction:column;align-items:center;gap:5px;background:#fff6e9;padding:8px 12px;border:2px solid transparent;border-radius:16px;min-width:88px}
.character-list button[aria-pressed="true"]{background:#e5ddff;border-color:var(--plum)}
.character-shell{--sheet-width:167%;--crop-top:-20%;--crop-left:0%}
.presenter-friend{position:relative;width:100%;aspect-ratio:384/340;overflow:hidden;border-radius:20px}
.presenter-friend img{position:absolute;max-width:none;height:auto}
.presenter-barnaby img{width:218%;left:0;top:0}
.presenter-rascal img{width:218%;left:-118%;top:0}
</style>
</head>
<body>
<main>
  <a href="../">← AbideCrest Media</a>
  <h1>Find the Letter</h1>
  <p class="intro">Listen, then tap the letter you hear.</p>
  <div class="game-stage">
    <section class="game" aria-label="Find the Letter game">
      <label class="difficulty">Difficulty
        <select id="difficulty"><option value="easy">Easy</option><option value="normal">Normal</option></select>
      </label>
      <div class="controls">
        <button type="button" id="hear">🔊 Hear the letter</button>
        <button type="button" id="show" aria-controls="prompt" aria-expanded="true">Hide the letter</button>
      </div>
      <p id="prompt" aria-live="polite">
        <span id="prompt-picture" aria-hidden="true"></span>
        <span id="prompt-text"></span>
      </p>
      <audio id="letter-audio" preload="auto" hidden></audio>
      <div class="tiles" id="tiles" role="group" aria-label="Choose a letter">
        <button type="button" class="letter" id="first"></button>
        <button type="button" class="letter" id="second"></button>
        <button type="button" class="letter" id="third" hidden></button>
        <button type="button" class="letter" id="fourth" hidden></button>
      </div>
      <div class="result">
        <p id="status" role="status"></p>
        <button type="button" id="next" hidden>Next letter →</button>
      </div>
    </section>
    <figure class="shell-presenter" id="active-presenter">
      <div class="shell-standing"><img src="art/shell.webp" width="640" height="681" alt="Shell standing with his clipboard, wearing glasses and a green visor" decoding="async"></div>
      <div class="presenter-friend" id="friend-presenter" hidden><img id="friend-presenter-image" src="art/barnaby-duo.webp" width="720" height="480" alt="" decoding="async"></div><figcaption id="presenter-name" aria-live="polite">Shell</figcaption>
    </figure>
  </div>
  <section class="character-friends" aria-labelledby="friends-heading">
    <h2 id="friends-heading">Play with our friends</h2>
    <div class="character-list" role="group" aria-label="Choose your presenter">
      <button type="button" data-presenter="shell" aria-pressed="true"><span class="character-portrait character-shell"><img src="art/shell.webp" alt="" decoding="async"></span><span>Shell</span></button>
      <button type="button" data-presenter="barnaby" aria-pressed="false"><span class="character-portrait character-barnaby"><img src="art/barnaby-duo.webp" alt="" decoding="async"></span><span>Barnaby</span></button>
      <button type="button" data-presenter="rascal" aria-pressed="false"><span class="character-portrait character-rascal"><img src="art/barnaby-duo.webp" alt="" decoding="async"></span><span>Rascal</span></button>
    </div>
  </section>
  <section class="stats" aria-labelledby="stats-heading">
    <h2 id="stats-heading">Your play stats</h2>
    <dl>
      <div><dt>Page views</dt><dd id="view-count">0</dd></div>
      <div><dt>Games played</dt><dd id="game-count">0</dd></div>
      <div><dt>Letters matched</dt><dd id="match-count">0</dd></div>
      <div><dt>Time played</dt><dd id="time-played">0 sec</dd></div>
    </dl>
    <p id="stats-note">Saved in this browser. Switching difficulty starts a new game when you make a choice.</p>
  </section>
  <noscript><p>Enable JavaScript to play.</p></noscript>
</main>
<script>
"use strict";

const alphabet = [..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"];
const letterClues = {
  A:["apple", "🍎"], B:["ball", "⚽"], C:["cat", "🐱"], D:["dog", "🐶"],
  E:["egg", "🥚"], F:["fish", "🐟"], G:["goat", "🐐"], H:["hat", "🎩"],
  I:["ice cream", "🍦"], J:["jellyfish", "🪼"], K:["kite", "🪁"], L:["lion", "🦁"],
  M:["moon", "🌙"], N:["nest", "🪺"], O:["orange", "🍊"], P:["pig", "🐷"],
  Q:["queen", "👸"], R:["rabbit", "🐰"], S:["sun", "☀️"], T:["turtle", "🐢"],
  U:["umbrella", "☂️"], V:["van", "🚐"], W:["whale", "🐋"], X:["x-ray", "🩻"],
  Y:["yarn", "🧶"], Z:["zebra", "🦓"]
};
const slowerLetters = new Set("BCDEGPTVZ");
const tiles = document.querySelector("#tiles");
const letters = [...tiles.querySelectorAll(".letter")];
const difficulty = document.querySelector("#difficulty");
const statsFields = {
  views: document.querySelector("#view-count"),
  games: document.querySelector("#game-count"),
  matches: document.querySelector("#match-count"),
  playMs: document.querySelector("#time-played")
};
const statsKey = "abidecrest.find-the-letter.stats.v1";
const stats = {views:0, games:0, matches:0, playMs:0};
const playIdleMs = 60000;
const playSaveMs = 5000;
let playSince = null;
let lastPlayAction = 0;
const numberFormat = new Intl.NumberFormat();
const fourChoiceThreshold = 5;
let keepStats = true;
let gameStarted = false;
let firstTryMatches = 0;
let hadWrongChoice = false;
const hear = document.querySelector("#hear");
const show = document.querySelector("#show");
const prompt = document.querySelector("#prompt");
const promptPicture = document.querySelector("#prompt-picture");
const promptText = document.querySelector("#prompt-text");
const status = document.querySelector("#status");
const next = document.querySelector("#next");
const audio = document.querySelector("#letter-audio");
let deck = [];
let target = "";
let answered = false;
let visiblePrompt = true;
let requestId = 0;

function showStats() {
  for (const key of ["views", "games", "matches"]) statsFields[key].textContent = numberFormat.format(stats[key]);
  showPlayTime();
  if (!keepStats) document.querySelector("#stats-note").textContent = "Saved for this visit.";
}

function loadStats(raw) {
  const saved = JSON.parse(raw) || {};
  for (const key of Object.keys(stats)) {
    stats[key] = Number.isSafeInteger(saved[key]) && saved[key] >= 0 ? saved[key] : 0;
  }
}

function countStat(key, amount = 1) {
  if (keepStats) {
    try {
      loadStats(localStorage.getItem(statsKey));
    } catch {
      keepStats = false;
    }
  }
  stats[key] += amount;
  if (keepStats) {
    try {
      localStorage.setItem(statsKey, JSON.stringify(stats));
    } catch {
      keepStats = false;
    }
  }
  showStats();
}

function unsavedPlayTime(now) {
  if (playSince === null) return 0;
  return Math.max(0, Math.floor(Math.min(now, lastPlayAction + playIdleMs) - playSince));
}

function showPlayTime(now = performance.now()) {
  const totalSeconds = Math.floor((stats.playMs + unsavedPlayTime(now)) / 1000);
  const hours = Math.floor(totalSeconds / 3600);
  const minutes = Math.floor(totalSeconds / 60) % 60;
  const seconds = totalSeconds % 60;
  statsFields.playMs.textContent = [
    hours ? numberFormat.format(hours) + " hr" : "",
    minutes ? minutes + " min" : "",
    seconds || (!hours && !minutes) ? seconds + " sec" : ""
  ].filter(Boolean).join(" ");
}

function savePlayTime(now, pause = false) {
  const amount = unsavedPlayTime(now);
  if (pause || now >= lastPlayAction + playIdleMs) playSince = null;
  else playSince += amount;
  if (amount) countStat("playMs", amount);
}

function recordPlayAction() {
  if (document.visibilityState !== "visible") return;
  const now = performance.now();
  if (playSince !== null && now >= lastPlayAction + playIdleMs) savePlayTime(now, true);
  if (playSince === null) playSince = now;
  lastPlayAction = now;
}

function shuffle(items) {
  for (let i = items.length - 1; i > 0; i--) {
    const index = Math.floor(Math.random() * (i + 1));
    [items[i], items[index]] = [items[index], items[i]];
  }
  return items;
}

function nextTarget() {
  if (!deck.length) {
    deck = shuffle(alphabet.slice());
    if (deck.at(-1) === target) deck.unshift(deck.pop());
  }
  return deck.pop();
}

function playLetter() {
  recordPlayAction();
  const request = ++requestId;
  // Keep play() inside the tap handler so mobile browsers can start audio.
  audio.currentTime = 0;
  audio.playbackRate = slowerLetters.has(target) ? .85 : 1;
  audio.play().catch(() => {
    if (request !== requestId) return;
    visiblePrompt = true;
    showPrompt();
  });
}

function showPrompt() {
  const [example, picture] = letterClues[target];
  promptPicture.textContent = picture;
  promptText.textContent = "Find " + target + " as in " + example;
  prompt.hidden = !visiblePrompt;
  show.textContent = visiblePrompt ? "Hide the letter" : "Show the letter";
  show.setAttribute("aria-expanded", String(visiblePrompt));
}

function newRound() {
  answered = false;
  hadWrongChoice = false;
  target = nextTarget();
  requestId++;
  audio.src = "audio/" + target.toLowerCase() + ".mp3";
  const count = difficulty.value === "easy" ? 2 : firstTryMatches >= fourChoiceThreshold ? 4 : 3;
  const distractors = shuffle(alphabet.filter(letter => letter !== target));
  const choices = shuffle([target, ...distractors.slice(0, count - 1)]);
  tiles.dataset.count = count;
  for (const [index, button] of letters.entries()) {
    button.textContent = choices[index] || "";
    button.hidden = index >= count;
    button.disabled = button.hidden;
    button.classList.remove("correct");
  }
  next.hidden = true;
  status.textContent = "";
  showPrompt();
}

for (const button of letters) {
  button.addEventListener("click", () => {
    if (answered || button.hidden) return;
    recordPlayAction();
    if (!gameStarted) {
      gameStarted = true;
      countStat("games");
    }
    if (button.textContent !== target) {
      hadWrongChoice = true;
      status.textContent = tiles.dataset.count === "2" ? "Try the other letter." : "Try another letter.";
      return;
    }
    answered = true;
    if (difficulty.value === "normal" && !hadWrongChoice) firstTryMatches++;
    countStat("matches");
    button.classList.add("correct");
    status.textContent = "You found " + target + "! ⭐";
    next.hidden = false;
    next.focus({preventScroll:true});
    for (const choice of letters) choice.disabled = true;
  });
}

difficulty.addEventListener("change", () => {
  gameStarted = false;
  firstTryMatches = 0;
  newRound();
});
hear.addEventListener("click", playLetter);
show.addEventListener("click", () => {
  recordPlayAction();
  visiblePrompt = !visiblePrompt;
  showPrompt();
});
next.addEventListener("click", () => {
  newRound();
  hear.focus({preventScroll:true});
  playLetter();
});
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden" && playSince !== null) savePlayTime(performance.now(), true);
});
window.addEventListener("pagehide", () => {
  if (playSince !== null) savePlayTime(performance.now(), true);
});
setInterval(() => {
  if (playSince === null) return;
  const now = performance.now();
  if (now - playSince >= playSaveMs || now >= lastPlayAction + playIdleMs) savePlayTime(now);
  showPlayTime(now);
}, 1000);
const presenterButtons = [...document.querySelectorAll("[data-presenter]")];
const presenterKey = "abidecrest.find-the-letter.presenter.v1";
function choosePresenter(name, save = true) {
  if (!["shell","barnaby","rascal"].includes(name)) name = "shell";
  const shell = document.querySelector(".shell-standing");
  const friend = document.querySelector("#friend-presenter");
  shell.hidden = name !== "shell";
  friend.hidden = name === "shell";
  friend.className = "presenter-friend presenter-" + name;
  const label = name[0].toUpperCase() + name.slice(1);
  document.querySelector("#friend-presenter-image").alt = label + " presenting the letter game";
  document.querySelector("#presenter-name").textContent = label;
  for (const button of presenterButtons) button.setAttribute("aria-pressed", String(button.dataset.presenter === name));
  if (save) { try { localStorage.setItem(presenterKey, name); } catch {} }
}
for (const button of presenterButtons) button.addEventListener("click", () => choosePresenter(button.dataset.presenter));
let savedPresenter = "shell";
try { savedPresenter = localStorage.getItem(presenterKey) || "shell"; } catch {}
choosePresenter(savedPresenter, false);
countStat("views");
newRound();
</script>
</body>
</html>
