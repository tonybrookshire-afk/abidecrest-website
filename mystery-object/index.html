<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What’s the Mystery Object? | Word Guessing Game</title><meta name="description" content="Use clues, guess letters, and solve the hidden word in this free browser puzzle."><link rel="canonical" href="https://www.abidecrest.com/mystery-object/"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"What’s the Mystery Object?","genre":"Word Guessing Game","url":"https://www.abidecrest.com/mystery-object/","description":"Use clues, guess letters, and solve the hidden word in this free browser puzzle.","gamePlatform":"Web browser","applicationCategory":"Game","isAccessibleForFree":true}</script>
<style>
*{box-sizing:border-box}
:root{color-scheme:light;--ink:#22253e;--paper:#fffaf0;--purple:#48336d;--border:#dfd3c4}
body{margin:0;background:#f1e7da;color:var(--ink);font:16px/1.5 system-ui,sans-serif}
main{width:min(100% - 28px,56rem);margin:auto;padding:20px 0 36px}
a{color:#48336d;font-weight:700}
h1{font-size:clamp(2.4rem,8vw,4.3rem);line-height:1;margin:.25em 0 .45em;letter-spacing:-.06em}
h2{font-size:1rem;margin:0;color:#6d3e31}
p{margin:.4em 0 .8em}
.game{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:clamp(14px,3vw,28px);padding:clamp(14px,3vw,26px);border:1px solid var(--border);border-radius:24px;background:var(--paper);box-shadow:0 10px 30px #422e1c13}
.scene{position:relative;min-height:230px;border-radius:18px;background:#d9e8df;overflow:hidden;display:grid;place-items:center}
.figure{position:relative;width:170px;height:205px}
.part,.mystery,.hand{position:absolute}
.part{background:#50456f;border:3px solid #34294f;border-radius:99px}
.part[hidden], [hidden]{display:none!important}
.head{width:54px;height:53px;left:58px;top:4px;background:#f1b78a}
.head::after{content:"";position:absolute;width:4px;height:4px;left:14px;top:18px;border-radius:50%;background:#34294f;box-shadow:15px 0 #34294f}
.torso{width:56px;height:73px;left:57px;top:54px;background:#c58ce4}
.arm{width:15px;height:57px;top:57px;background:#f1b78a}
.left-arm{left:47px;transform:rotate(24deg)}
.right-arm{right:47px;transform:rotate(-24deg)}
.leg{width:19px;height:62px;top:116px}
.left-leg{left:62px;transform:rotate(12deg)}
.right-leg{right:62px;transform:rotate(-12deg)}
.mystery{width:74px;height:67px;top:76px;left:48px;display:grid;place-items:center;background:#48336d;color:white;border:3px solid #34294f;border-radius:18px;font-size:2rem;font-weight:900;z-index:1}
.mystery.revealed{background:#fff2bd}
.hand{width:16px;height:17px;top:107px;border-radius:50%;background:#f1b78a;border:2px solid #34294f;z-index:2}
.hand.left{left:40px}.hand.right{right:40px}
.word{display:flex;gap:8px 12px;flex-wrap:wrap;margin:12px 0 16px}
.word-group{display:inline-flex;gap:3px}
.letter{display:inline-grid;place-items:center;min-width:1.25ch;height:1.2em;border-bottom:2px solid #6d577e;font-size:clamp(1rem,4vw,1.55rem);font-weight:800}
.actions,form{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
label{display:block;width:100%;font-weight:700}
button,input{min-height:44px;border-radius:10px;border:1px solid #9b87a8;font:inherit;padding:8px 12px}
input{background:#fff;color:var(--ink);min-width:0;flex:1 1 125px}
button{cursor:pointer;background:#ede2f4;color:#392453;font-weight:750}
button.primary{background:var(--purple);color:white}
button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:3px solid #1b7669;outline-offset:3px}
#status{min-height:1.5em;font-weight:750;margin-top:12px}
.progress-card{margin:12px 0;padding:12px 14px;border:1px solid #ded0bf;background:#fff5e3;border-radius:14px}.progress-card p{margin:0 0 6px;font-weight:800}.progress-card progress{width:100%;height:12px;accent-color:#6950a0;display:block}.progress-caption{font-size:.85rem;color:#665568;margin-top:5px}.round-result{padding:16px;margin:12px 0;background:#fff0d6;border:2px solid #d7a55e;border-radius:16px}.round-result.win{background:#e4f5e6;border-color:#75a57b}.round-result h2{font-size:1.35rem;color:var(--ink)}.round-result .answer{font-size:clamp(1.4rem,5vw,2rem);font-weight:900;color:#48336d;overflow-wrap:anywhere;margin:6px 0}.round-result p{margin:6px 0}.encouragement{padding:10px 12px;background:#f2e9f8;border-radius:12px;color:#48336d;font-weight:700;margin-top:12px}.mystery.revealed{font-size:2.65rem}#hint{background:#f5e7d9;padding:8px 10px;border-radius:10px}
@media(max-width:650px){.game{grid-template-columns:1fr}.scene{min-height:205px}}
</style>
<script src="objects.js" defer></script>
<script src="game.js?v=play-stats-1" defer></script>
</head>
<body>
<main>
<a href="../">← AbideCrest Media</a>
<h1>What’s the Mystery Object?</h1>
<section class="game" aria-label="Object guessing game">
  <div class="scene" aria-label="Character holding a hidden object" role="img" id="scene">
    <div class="figure" aria-hidden="true">
      <div class="part left-leg leg" hidden></div><div class="part right-leg leg" hidden></div>
      <div class="part torso" hidden></div><div class="part head" hidden></div>
      <div class="part left-arm arm" hidden></div><div class="part right-arm arm" hidden></div>
      <div class="mystery" id="object">?</div><div class="hand left"></div><div class="hand right"></div>
    </div>
  </div>
  <div>
    <h2>First clue</h2>
    <p id="clue"></p>
    <p id="hint" hidden></p>
    <div class="progress-card"><p id="parts-count" role="status"></p><progress id="parts-progress" max="6" value="0" aria-label="Character parts revealed"></progress><div id="progress-caption" class="progress-caption"></div></div><div id="word" class="word" role="img"></div>
    <form id="guess-form">
      <label for="guess">Guess the whole object</label>
      <input id="guess" type="text" autocomplete="off" spellcheck="false" maxlength="70" required>
      <button class="primary" id="submit" type="submit">Guess</button>
    </form>
    <form id="letter-form" style="margin-top:1rem">
      <label for="letter-guess">Guess a letter</label>
      <input id="letter-guess" maxlength="1" pattern="[A-Za-z]" autocomplete="off" autocapitalize="characters" required>
      <button id="try-letter">Try letter</button>
    </form>
    <p>A correct letter takes one part off. A miss adds one.</p>
    <p id="tried"></p>
    <p id="status" role="status"></p><section id="round-result" class="round-result" aria-live="polite" hidden><h2 id="result-title"></h2><p>The mystery object was:</p><p class="answer" id="result-answer"></p><p id="result-detail"></p></section>
    <div class="actions">
      <button id="part" type="button">Add a part for a letter</button>
      <button id="clue-button" type="button">Another hint</button>
      <button id="new" type="button">New object</button>
    </div>
    <p class="encouragement" id="encouragement">Shell says: Let’s solve a mystery!</p>
  </div>
</section>
<noscript><p>Enable JavaScript to play.</p></noscript>
<section data-play-stats="mystery-object" style="margin:20px 0 0;padding:16px;border:1px solid currentColor;border-radius:14px"><h2>Your stats on this device</h2><dl style="display:flex;gap:12px 24px;flex-wrap:wrap;margin:10px 0"><div><dt>Page views</dt><dd data-stat="views" style="margin:0;font-weight:bold">0</dd></div><div><dt>Games played</dt><dd data-stat="games" style="margin:0;font-weight:bold">0</dd></div><div><dt>Active play time</dt><dd data-stat="time" style="margin:0;font-weight:bold">0</dd></div><div><dt>Objects solved</dt><dd data-stat="solved" style="margin:0;font-weight:bold">0</dd></div></dl><small>Saved in this browser.</small></section></main><script>const localPlay = (() => {
  const panel = document.querySelector('[data-play-stats]');
  const key = 'abidecrest.play.v1.' + panel.dataset.playStats;
  const fields = [...panel.querySelectorAll('[data-stat]')];
  let totals = {}, started = false, last = null, expiry = 0, persistent = true;
  function update(field, value, best = false) {
    if (persistent) {
      try { totals = JSON.parse(localStorage.getItem(key)) || {}; }
      catch { persistent = false; }
    }
    const previous = Number(totals[field]) || 0;
    totals[field] = best ? Math.max(previous, value) : previous + value;
    if (persistent) {
      try { localStorage.setItem(key, JSON.stringify(totals)); }
      catch { persistent = false; }
    }
    for (const item of fields) {
      const n = Number(totals[item.dataset.stat]) || 0;
      item.textContent = item.dataset.stat === 'time' ? Math.floor(n/60000)+'m '+Math.floor(n/1000)%60+'s' : n.toLocaleString();
    }
    if (!persistent) panel.querySelector('small').textContent = 'Stats for this visit only.';
  }
  function flush() {
    if (last === null) return;
    const now = performance.now();
    const elapsed = Math.max(0, Math.min(expiry, now) - last);
    last = now >= expiry ? null : now;
    if (elapsed) update('time', elapsed);
  }
  function pause() { flush(); last = null; }
  function action() {
    if (document.hidden) return;
    if (!started) { started = true; update('games', 1); }
    const now = performance.now();
    if (last !== null && now >= expiry) flush();
    if (last === null) last = now;
    expiry = now + 60000;
  }
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  window.addEventListener('pagehide', pause);
  setInterval(flush, 5000);
  update('views', 1);
  return {action, pause, reset(){pause(); started=false;}, update};
})();</script>
