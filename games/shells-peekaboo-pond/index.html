<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shell’s Peekaboo Pond · AbideCrest</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8eed8;color:#193e39;font-family:ui-rounded,"Trebuchet MS",sans-serif}header,main{max-width:900px;margin:auto}header{padding:14px 18px;display:flex;align-items:center;justify-content:space-between}header a{color:inherit}button{cursor:pointer;touch-action:manipulation;font:inherit;color:inherit}header button{background:#fff9e9;border:1px solid #b8b598;border-radius:24px;padding:10px 15px}main{text-align:center;padding:0 12px 20px}h1{font: bold clamp(27px,5vw,48px) Georgia,serif;margin:6px 0 15px}.pond{position:relative;isolation:isolate;overflow:hidden;height:clamp(305px,62svh,510px);border-radius:35px;background:radial-gradient(ellipse at 75% 11%,#fff1af 0 5%,transparent 5.5%),radial-gradient(ellipse at 80% 43%,#80ae78 0 25%,transparent 25.5%),radial-gradient(ellipse at 15% 40%,#5b9974 0 30%,transparent 30.5%),linear-gradient(#a7ded5,#f9e7a8 56%,#68c8ac 57%,#297f89 83%,#226476);box-shadow:inset 0 -8px 0 #1e6269}
.water{position:absolute;inset:56% 0 0;background:repeating-radial-gradient(ellipse at 76% 55%,transparent 0 12%,#baf1d841 12.3% 12.8%,transparent 13.3% 21%)}.dock{position:absolute;left:-4%;bottom:9%;width:53%;height:14%;border-radius:30%;transform:rotate(4deg);background:repeating-linear-gradient(100deg,#b27a4a 0 17%,#68452e 18%,#cc9360 19%);box-shadow:0 9px #6b4936}.pond button{position:absolute;border:0;background:none;padding:0}.shell{bottom:19%;left:2%;width:45%;height:58%;transform-origin:bottom}.shell img,.rascal img{width:100%;height:100%;object-fit:contain}.pad{left:52%;top:57%;width:42%;height:35%}.leaf{position:absolute;inset:33% 7% 16%;background:conic-gradient(from 120deg,#658c34 0 5deg,transparent 6deg 35deg,#b4e56a 36deg,#66b554 170deg,#a7d75b);border-radius:50%;filter:drop-shadow(0 5px 0 #317856);animation:sway 2.6s ease-in-out infinite}.eyes{position:absolute;left:37%;top:18%;font-size:clamp(25px,6vw,44px)}.frog{left:14%;top:20%;width:24%;height:21%;font-size:clamp(40px,9vw,72px)!important;filter:drop-shadow(1px 4px 2px #17493150)}.bubble{right:7%;bottom:14%;width:clamp(74px,17vw,112px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 30% 20%,white, #d1f8f4 15%,#72cdd4 65%,#d4ffff 85%)!important;box-shadow:0 5px 12px #194f5966;font-size:38px!important}.rascal{right:1%;bottom:18%;height:52%;width:43%}.line{font:bold clamp(20px,4vw,30px) Georgia,serif;margin:15px 0}.start{left:50%;top:44%;transform:translate(-50%,-50%);padding:16px 32px!important;border-radius:40px;background:#fff4cb!important;font-weight:bold;font-size:24px;box-shadow:0 4px #a27741}.hint:after{content:"👆";position:absolute;right:5%;bottom:-8%;font-size:32px;animation:sway 1s infinite}.hop{animation:hop .68s ease}.arrive{animation:arrive .85s ease-out}.bob{animation:bob .68s ease}.pond button:focus-visible{outline:4px solid #fff}.flora{position:absolute;bottom:0;left:-8px;font-size:clamp(36px,8vw,72px);pointer-events:none}
@keyframes sway{50%{transform:rotate(5deg) translateY(-3px)}}@keyframes hop{45%{transform:translateY(-55%) rotate(-12deg)}}@keyframes arrive{from{transform:translate(205%,202%) scale(.6)}52%{transform:translate(85%,-35%)}}@keyframes bob{75%{transform:rotate(4deg) scaleY(.95)}}@media(prefers-reduced-motion:reduce){*,*:after{animation:none!important}}
.pond{container-type:size}.shell{width:min(47cqw,64cqh);height:min(47cqw,64cqh);bottom:17%}.frog{left:calc(2% + min(35.25cqw,48cqh) - 12%);top:auto;bottom:calc(17% + min(40.42cqw,55.04cqh) - 5%);display:grid;place-items:end center}.frog[hidden]{display:none}
.landing{position:absolute;right:2%;bottom:13%;width:46%;height:53%;pointer-events:none}
.landing .rascal{right:7%;bottom:12%;width:86%;height:87%;pointer-events:auto}
.rascal img{object-position:center bottom}
.landing .log{left:0;bottom:0;width:100%;height:22%;border-radius:45%;pointer-events:auto}
.log svg{display:block;width:100%;height:100%;overflow:visible}
.tail{position:absolute;left:58%;bottom:15%;height:41%;width:15%;border-radius:66% 70% 40% 44%;transform:rotate(20deg);background:repeating-linear-gradient(15deg,#544039 0 17%,#b09b84 18% 33%);transform-origin:bottom;animation:sway 2s infinite}
.landing:after{content:"";position:absolute;bottom:-2%;left:2%;width:96%;height:12%;border:3px solid #c6f5de;border-radius:50%;opacity:0}
.landing.splash:after{animation:rings 1.2s .45s both}
.landing.splash{animation:dip .95s ease-out}
.landing.splash .rascal img{animation:balance .95s ease-out;transform-origin:center bottom}
.pond.revealed .bubble{right:2%;bottom:1%;width:clamp(52px,10vw,78px)}
@keyframes dip{0%,51%,100%{transform:translateY(0)}68%{transform:translateY(6%) rotate(2deg)}85%{transform:translateY(-1%) rotate(-1deg)}}
@keyframes balance{0%{transform:translateY(16%) scale(.7);opacity:0}30%{transform:translateY(-19%) rotate(-7deg);opacity:1}54%{transform:translateY(0)}70%{transform:rotate(6deg)}}
@keyframes rings{0%{opacity:.8;transform:scale(.75)}100%{opacity:0;transform:scale(1.35,1.7)}}
@media(prefers-reduced-motion:reduce){.landing,.landing *,.landing:after{animation:none!important}}
.pond{background:#78bdaa url(pond.webp) center/100% 100% no-repeat}.water,.dock,.flora{display:none}.pad{background: url(pad.webp) center/contain no-repeat!important;animation:sway 2.6s ease-in-out infinite}.pad span{display:none}.pond .frog{background:url(frog.webp) center bottom/auto 58.4% no-repeat;font-size:0!important}.landing .log{height:29%;background:url(log.webp) center/100% 100% no-repeat}.log svg{display:none}.landing .rascal{bottom:19%}.pond:not(.revealed) .bubble{background: url(paw.webp) center/contain no-repeat!important;font-size:0!important;box-shadow:none}@media(prefers-reduced-motion:reduce){.pad{animation:none}}.shell img{position:absolute;inset:0;transition:opacity .12s linear}.shell .look-up{opacity:0}.pond:has(.frog:not([hidden])) .shell img{transition-delay:.24s;opacity:0}.pond:has(.frog:not([hidden])) .shell .look-up{opacity:1}@media(prefers-reduced-motion:reduce){.shell img,.pond:has(.frog:not([hidden])) .shell img{transition:none}}</style></head><body><header><a href="/">← AbideCrest games</a><button id="sound" aria-pressed="true">Sound on</button></header><main><h1>Shell’s Peekaboo Pond</h1><section class="pond" aria-label="Pond story"><div class="water"></div><div class="dock"></div>
<button class="shell" aria-label="Hear Shell’s prompt again"><img src="shell-point.webp" alt=""><img class="look-up" src="shell-look.webp" alt=""></button>
<button class="pad" aria-label="Tap the lily pad" hidden><span class="eyes">👀</span><span class="leaf"></span></button>
<button class="frog" aria-label="Make Frog hop" hidden>🐸</button><div class="landing" hidden><span class="tail" aria-hidden="true"></span><button class="log" aria-label="Tap the log to find Rascal"><svg viewBox="0 0 300 62" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="bark" x2="0" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#e1ae69"/><stop offset=".48" stop-color="#a5683c"/><stop offset="1" stop-color="#694329"/></linearGradient></defs><path d="M22 13 Q130 3 270 9 Q292 10 291 30 Q290 50 272 52 L27 56 Q8 56 7 35 Q6 18 22 13Z" fill="url(#bark)" stroke="#62432d" stroke-width="3"/><g fill="none" stroke="#77472a" stroke-width="3" stroke-linecap="round"><path d="M49 32q40-10 78-6t83-6m-157 23q50-5 84-3m24-6q45-5 81-4"/></g><ellipse cx="24" cy="35" rx="18" ry="20" fill="#e6b278" stroke="#805737" stroke-width="3"/><ellipse cx="24" cy="35" rx="10" ry="13" fill="none" stroke="#bc8452" stroke-width="3"/><path d="M43 15q26-13 49-6t34-1q-8 10-33 10t-50 2" fill="#8caa5c"/></svg></button><button class="rascal" aria-label="Play peekaboo with Rascal" hidden><img src="../../find-the-letter/art/rascal-presenter.png" alt=""></button></div>
<button class="bubble" aria-label="Follow the paw print" hidden>🐾</button><div class="flora">🌾</div><button class="start">Play peekaboo</button></section><p class="line" aria-live="polite">Who’s hiding in the pond?</p></main>
<script>
const el = name => document.querySelector('.' + name);
const sound = document.querySelector('#sound');
let voice = true, stage = 'start', hintTimer, bubbleTimer;
function say(message) {
  el('line').textContent = message;
  if (voice && 'speechSynthesis' in window) {
    speechSynthesis.cancel();
    const words = new SpeechSynthesisUtterance(message);
    words.lang = 'en-US'; words.rate = .86; speechSynthesis.speak(words);
  }
}
function hint(target) {
  clearTimeout(hintTimer);
  document.querySelector('.hint')?.classList.remove('hint');
  hintTimer = setTimeout(() => el(target).classList.add('hint'), 5000);
}
function animate(target, effect) {
  const item = el(target); item.classList.remove('arrive','hop','bob');
  void item.offsetWidth; item.classList.add(effect);
}
const croak = new Audio('ribbit.wav');
croak.preload = 'auto';
croak.volume = .62;
function ribbit() {
  if (!voice) return;
  croak.currentTime = 0;
  croak.play().catch(() => {});
}
let context;
function waterSound(start, end, duration) {
  if (!voice) return;
  const Engine = window.AudioContext || window.webkitAudioContext;
  if (!Engine) return;
  context ??= new Engine();
  context.resume().catch(() => {});
  const tone = context.createOscillator(), volume = context.createGain(), t = context.currentTime;
  tone.frequency.setValueAtTime(start,t); tone.frequency.exponentialRampToValueAtTime(end,t+duration);
  volume.gain.setValueAtTime(.001,t); volume.gain.exponentialRampToValueAtTime(.08,t+.012);
  volume.gain.exponentialRampToValueAtTime(.001,t+duration);
  tone.connect(volume); volume.connect(context.destination); tone.start(t); tone.stop(t+duration);
}
function begin() {
  clearTimeout(bubbleTimer); stage = 'pad'; el('landing').hidden = true; el('landing').classList.remove('splash'); el('pond').classList.remove('revealed');
  for (const name of ['start','rascal','bubble','frog']) el(name).hidden = true;
  el('bubble').textContent = '🐾'; el('bubble').ariaLabel = 'Follow the paw print';
  el('pad').hidden = false; say('Tap the lily pad!'); hint('pad');
}
el('start').onclick = begin;
el('pad').onclick = () => {
  stage = 'frog'; el('pad').hidden = true; el('frog').hidden = false;
  ribbit(); animate('frog','arrive'); animate('shell','bob'); say('Peekaboo! Tap Frog for a hop!'); hint('frog');
  bubbleTimer = setTimeout(() => {
    el('bubble').hidden = false;
    say('Tap Frog to hop, or tap the bubble!'); hint('bubble');
  }, 5500);
};
el('frog').onclick = () => { animate('frog','hop'); animate('shell','bob'); window.speechSynthesis?.cancel(); ribbit(); el('line').textContent = 'Ribbit!'; };
el('bubble').onclick = () => {
  if (stage === 'rascal') return begin();
  waterSound(640,310,.12); stage = 'log'; el('frog').hidden = true; el('bubble').hidden = true;
  el('landing').hidden = false; el('tail').hidden = false; el('log').disabled = false;
  say('Whose tail is that? Tap the log!'); hint('log');
};
function land(){
  setTimeout(() => { if (stage === 'rascal') waterSound(185,75,.22); }, 440);
  el('landing').classList.remove('splash'); void el('landing').offsetWidth; el('landing').classList.add('splash');
}
el('log').onclick = () => {
  stage = 'rascal'; el('tail').hidden = true; el('log').disabled = true;
  el('rascal').hidden = false; el('bubble').hidden = false; el('pond').classList.add('revealed');
  land(); el('bubble').textContent = '↻'; el('bubble').ariaLabel = 'Play again';
  say('Peekaboo, Rascal! Tap Rascal!'); hint('rascal');
};
el('rascal').onclick = () => { land(); say('Peekaboo! Tap the round arrow to play again.'); hint('bubble'); };
function promptAgain(){
  const prompts = {start:'Tap play for peekaboo!',pad:'Tap the lily pad!',log:'Tap the log!',frog:el('bubble').hidden?'Tap Frog for a hop!':'Tap Frog to hop, or tap the bubble!',rascal:'Tap Rascal, or tap the round arrow to play again!'};
  say(prompts[stage]);
}
el('shell').onclick = promptAgain;
sound.onclick = () => { voice = !voice; sound.textContent = voice?'Sound on':'Sound off'; sound.setAttribute('aria-pressed',String(voice)); if(voice) promptAgain(); else { croak.pause(); window.speechSynthesis?.cancel(); } };
</script><script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"cf53d17fe27e4d12bf6e0ae3ed3b5f63"}'></script></body></html>
