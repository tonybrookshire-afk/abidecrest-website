<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Match letters along winding alphabet paths in Letter Trails, a browser game from AbideCrest Media.">
<title>Letter Trails | AbideCrest Media</title>
<style>
* { box-sizing:border-box }
body { margin:0; background:#111b2b; color:#f6f7fc; font:16px system-ui,sans-serif }
main { width:min(100% - 24px, 960px); margin:0 auto; padding:14px 0 }
a { color:#9cebd3 }
header { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap }
h1 { margin:8px 0 2px; font-size:clamp(2rem,6vw,3.25rem); letter-spacing:-.045em }
p { margin:6px 0 12px; color:#d8e4f1 }
.controls { display:flex; align-items:end; flex-wrap:wrap; gap:10px; margin:12px 0 }
label { display:grid; gap:4px; font-size:.83rem; font-weight:700 }
button,select,input { min-height:44px; font:inherit; padding:8px 10px; border-radius:10px; border:1px solid #8398b4; background:#20314a; color:white }
button { cursor:pointer; background:#a8efd6; color:#142c29; font-weight:750 }
input { width:5rem }
[hidden] { display:none!important }
canvas { width:100%; height:clamp(440px,65svh,710px); display:block; touch-action:none; border-radius:18px }
#status { min-height:2.5em; margin:10px 0 0 }
</style>
</head>
<body>
<main>
<header><a href="../">← AbideCrest Media</a></header>
<h1>Letter Trails</h1>
<p>Drag a lowercase letter to the open end of the line that leads to its uppercase match.</p>
<div class="controls">
  <label>Board style <select id="theme"><option>Classic</option><option>Rainbow</option><option>Space</option><option>Notebook</option></select></label>
  <label>Difficulty <select id="level"><option>Easy</option><option>Normal</option><option selected>Challenge</option></select></label>
  <label id="line-control">Lines (7–16) <input id="lines" type="number" min="7" max="16" value="7" inputmode="numeric"></label>
  <button type="button" id="new">New Board</button>
</div>
<canvas id="board" aria-label="Letter matching board" aria-describedby="status">Letter Trails requires a browser with canvas support.</canvas>
<p id="status" role="status"></p>
<noscript><p>Enable JavaScript to play Letter Trails.</p></noscript>
</main>
<script>
"use strict";

const board = document.querySelector("#board");
const ctx = board.getContext("2d");
const theme = document.querySelector("#theme");
const level = document.querySelector("#level");
const lines = document.querySelector("#lines");
const status = document.querySelector("#status");
const palettes = {
  Classic: { paper:"#fcfbf5", line:"#7d8999", chip:"#fff", ink:"#192b42", active:"#08745f" },
  Rainbow: { paper:"#fff3fc", line:"#948397", chip:"#fff", ink:"#412446", active:"#7641a1" },
  Space: { paper:"#131c38", line:"#8d9abd", chip:"#24365e", ink:"#fff", active:"#80f1d6" },
  Notebook: { paper:"#fff7e6", line:"#887d86", chip:"#fffdf7", ink:"#403649", active:"#2c599f" }
};
const rainbow = ["#ac2652","#94500c","#176a55","#166797","#763d93"];
const steps = 160;
let routes = [];
let tiles = [];
let drag = null;
let sparks = [];
let frame = null;
let width, height, scale, radius;

function shuffle(items) {
  for (let i = items.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [items[i], items[j]] = [items[j], items[i]];
  }
}

function makeBoard() {
  const challenge = level.value === "Challenge";
  document.querySelector("#line-control").hidden = !challenge;
  const entered = lines.valueAsNumber;
  const count = challenge ? Math.max(7, Math.min(16, Number.isFinite(entered) ? Math.round(entered) : 7))
    : level.value === "Easy" ? 3 : 5;
  if (challenge) lines.value = count;

  const exits = Array.from({length:count}, (_, i) => i);
  if (challenge) {
    shuffle(exits);
    if (exits.every((exit, i) => exit === i)) exits.push(exits.shift());
  } else if (count === 5) {
    const i = Math.floor(Math.random() * (count - 1));
    [exits[i], exits[i + 1]] = [exits[i + 1], exits[i]];
  }
  const letters = count === 7 ? "LMNOPQR" : "ABCDEFGHIJKLMNOP";
  routes = exits.map((exit, index) => ({
    exit, letter:letters[index], done:false,
    bend:(Math.random() * 2 - 1) * (challenge ? .8 : .24)
  }));
  tiles = routes.map(route => ({ letter:route.letter }));
  shuffle(tiles);
  stopFireworks();
  layout();
  status.textContent = "0 of " + count + " letters matched.";
}

function layout() {
  drag = null;
  const bounds = board.getBoundingClientRect();
  width = bounds.width;
  height = bounds.height;
  scale = Math.min(window.devicePixelRatio || 1, 3);
  board.width = Math.round(width * scale);
  board.height = Math.round(height * scale);
  const inset = routes.length > 8 ? 12 : 0;
  const lane = (width - inset * 2) / routes.length;
  const stagger = routes.length > 8 ? 44 : 0;
  radius = Math.min(20, lane * (stagger ? .84 : .46));
  const columns = Math.min(8, tiles.length);
  const trayHeight = tiles.length > columns ? 106 : 57;
  const trayTop = height - trayHeight;
  tiles.forEach((tile, i) => {
    const row = Math.floor(i / columns);
    const rowCount = Math.min(columns, tiles.length - row * columns);
    tile.point = {x:(i % columns + .5) * width / rowCount, y:trayTop + 28 + row * 47};
  });
  for (const [index, route] of routes.entries()) {
    const startX = inset + (index + .5) * lane;
    const endX = inset + (route.exit + .5) * lane;
    const startY = 25 + index % 2 * stagger;
    const endY = trayTop - 25 - route.exit % 2 * stagger;
    const top = 51 + stagger;
    const bottom = trayTop - top;
    route.points = Array.from({length:steps + 1}, (_, i) => {
      const t = i / steps;
      if (t < .17) return {x:startX, y:startY + (top - startY) * t / .17};
      if (t > .83) return {x:endX, y:bottom + (endY - bottom) * (t - .83) / .17};
      const u = (t - .17) / .66;
      const smooth = u * u * (3 - 2 * u);
      const wave = Math.sin(Math.PI * u) * Math.sin(2 * Math.PI * u);
      const x = startX + (endX - startX) * smooth + lane * route.bend * wave;
      return {x:Math.max(8, Math.min(width - 8, x)), y:top + (bottom - top) * u};
    });
  }
  draw();
}

function stroke(points, from, to, color, weight) {
  if (from === to) return;
  ctx.beginPath();
  ctx.moveTo(points[from].x, points[from].y);
  for (let i = from + 1; i <= to; i++) ctx.lineTo(points[i].x, points[i].y);
  ctx.strokeStyle = color;
  ctx.lineWidth = weight;
  ctx.lineJoin = ctx.lineCap = "round";
  ctx.stroke();
}

function artwork(palette) {
  ctx.fillStyle = palette.paper;
  ctx.fillRect(0, 0, width, height);
  if (theme.value === "Notebook") {
    ctx.fillStyle = "#e9deca";
    for (let y = 20; y < height; y += 22) ctx.fillRect(0, y, width, 1);
  }
  if (theme.value === "Space") {
    ctx.fillStyle = "#55628a";
    for (let i = 0; i < 72; i++) {
      const size = i % 7 === 0 ? 2 : 1;
      ctx.fillRect((i * 173 + 29) % 991 / 991 * width, (i * 137 + 79) % 983 / 983 * height, size, size);
    }
  }
}

function chip(point, letter, radius, palette, border, filled = true) {
  ctx.beginPath();
  ctx.arc(point.x, point.y, radius, 0, Math.PI * 2);
  ctx.fillStyle = filled ? palette.chip : palette.paper;
  ctx.fill();
  ctx.strokeStyle = border;
  ctx.lineWidth = filled ? 2 : 1.5;
  ctx.setLineDash(filled ? [] : [3, 3]);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = palette.ink;
  ctx.font = "750 " + Math.round(radius * 1.1) + "px system-ui";
  ctx.fillText(letter, point.x, point.y + 1);
}

function tileRadius() {
  return Math.min(19, width / Math.min(8, tiles.length) * .43);
}

function draw() {
  const palette = palettes[theme.value];
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  artwork(palette);
  const divider = tiles[0].point.y - 28;
  ctx.fillStyle = palette.line;
  ctx.fillRect(0, divider, width, 1);

  for (const route of routes) stroke(route.points, 0, steps, palette.line, 2);
  routes.forEach((route, i) => {
    if (!route.done) return;
    const color = theme.value === "Rainbow" ? rainbow[i % rainbow.length] : palette.active;
    ctx.globalAlpha = .23;
    stroke(route.points, 0, steps, color, 10);
    ctx.globalAlpha = 1;
    stroke(route.points, 0, steps, color, 4);
  });

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  const hovered = drag && findTarget(drag.point);
  for (const route of routes) {
    const border = route.done || hovered === route ? palette.active : palette.line;
    chip(route.points[0], route.letter, radius, palette, border);
    chip(route.points[steps], route.done ? route.letter.toLowerCase() : "", radius, palette, border, route.done);
  }
  for (const tile of tiles) {
    if (tile === drag?.tile || routes.some(route => route.done && route.letter === tile.letter)) continue;
    chip(tile.point, tile.letter.toLowerCase(), tileRadius(), palette, palette.line);
  }
  if (drag) chip(drag.point, drag.tile.letter.toLowerCase(), tileRadius(), palette, palette.active);
  for (const spark of sparks) {
    ctx.globalAlpha = spark.opacity;
    ctx.fillStyle = spark.color;
    ctx.beginPath();
    ctx.arc(spark.x * width, spark.y * height, 3, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function stopFireworks() {
  if (frame !== null) cancelAnimationFrame(frame);
  frame = null;
  sparks = [];
}

function celebrate() {
  const colors = ["#f25d87", "#ffb43a", "#25ad84", "#448ef4", "#9658ec"];
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const start = performance.now();

  function animate(now) {
    sparks = [];
    for (let burst = 0; burst < 4; burst++) {
      const age = reduced ? .45 : (now - start - burst * 260) / 1000;
      if (age < 0 || age > 1.25) continue;
      for (let i = 0; i < 30; i++) {
        const angle = i * Math.PI * 2 / 30;
        const travel = Math.min(width, height) * age * (.12 + (i % 3) * .055);
        sparks.push({
          x:.2 + burst * .2 + Math.cos(angle) * travel / width,
          y:.28 + (burst % 2) * .19 + (Math.sin(angle) * travel + age * age * 24) / height,
          color:colors[(i + burst) % colors.length],
          opacity:1 - age / 1.25
        });
      }
    }
    draw();
    frame = !reduced && now - start < 2050 ? requestAnimationFrame(animate) : null;
  }

  if (reduced) animate(start);
  else frame = requestAnimationFrame(animate);
}

function position(event) {
  const bounds = board.getBoundingClientRect();
  return {x:event.clientX - bounds.left, y:event.clientY - bounds.top};
}

function distance(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function findTarget(point) {
  let closest = radius + 7;
  let target;
  for (const route of routes) {
    const gap = distance(point, route.points[steps]);
    if (gap >= closest) continue;
    closest = gap;
    target = route;
  }
  return target;
}

board.addEventListener("pointerdown", event => {
  if (drag || event.button !== 0) return;
  const point = position(event);
  const tile = tiles.find(item => distance(point, item.point) <= tileRadius() + 2 &&
    !routes.some(route => route.done && route.letter === item.letter));
  if (!tile) return;
  board.setPointerCapture(event.pointerId);
  drag = {id:event.pointerId, tile, point};
  draw();
});

board.addEventListener("pointermove", event => {
  if (drag?.id !== event.pointerId) return;
  drag.point = position(event);
  draw();
});

board.addEventListener("pointerup", event => {
  if (drag?.id !== event.pointerId) return;
  const { tile } = drag;
  drag = null;
  const target = findTarget(position(event));
  if (target && !target.done && target.letter === tile.letter) {
    target.done = true;
    const done = routes.filter(route => route.done).length;
    status.textContent = done === routes.length ? "Board complete! You matched every letter."
      : target.letter + " matches " + tile.letter.toLowerCase() + ". " + done + " of " + routes.length + " matched.";
    if (done === routes.length) celebrate();
  } else if (target) {
    status.textContent = "Try another line for " + tile.letter.toLowerCase() + ".";
  }
  draw();
});

function cancel(event) {
  if (drag?.id !== event.pointerId) return;
  drag = null;
  draw();
}

board.addEventListener("pointercancel", cancel);
board.addEventListener("lostpointercapture", cancel);
document.querySelector("#new").addEventListener("click", makeBoard);
level.addEventListener("change", makeBoard);
lines.addEventListener("change", makeBoard);
theme.addEventListener("change", draw);
makeBoard();
new ResizeObserver(layout).observe(board);
</script>
</body>
</html>
